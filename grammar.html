<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST</title>
</head>
<body style="background:#111;color:#fff;font-family:monospace;padding:20px;font-size:14px;line-height:1.8;">
  <div id="out">Cargando...</div>

  <script src="data-verbs.js" onerror="window.__e1='data-verbs.js'"></script>
  <script src="data-grammar.js" onerror="window.__e2='data-grammar.js'"></script>
  <script src="grammar-generator.js" onerror="window.__e3='grammar-generator.js'"></script>
  <script src="app.js" onerror="window.__e4='app.js'"></script>
  <script src="grammar-app.js" onerror="window.__e5='grammar-app.js'"></script>

  <script>
    window.__jsErrors = [];
    window.addEventListener("error", function(e) {
      window.__jsErrors.push((e.message || "?") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
    });

    setTimeout(function() {
      var lines = [];
      lines.push("=== RESULTADO DEL TEST ===");
      lines.push("");
      lines.push("Carga de archivos:");
      lines.push("  data-verbs.js ........ " + (window.__e1 ? "❌ NO CARGÓ" : "✓"));
      lines.push("  data-grammar.js ...... " + (window.__e2 ? "❌ NO CARGÓ" : "✓"));
      lines.push("  grammar-generator.js . " + (window.__e3 ? "❌ NO CARGÓ" : "✓"));
      lines.push("  app.js ............... " + (window.__e4 ? "❌ NO CARGÓ" : "✓"));
      lines.push("  grammar-app.js ....... " + (window.__e5 ? "❌ NO CARGÓ" : "✓"));
      lines.push("");
      lines.push("Variables globales:");
      lines.push("  IRREGULAR_VERBS ...... " + typeof IRREGULAR_VERBS);
      lines.push("  ALL_EXERCISES ........ " + typeof ALL_EXERCISES);
      lines.push("  GRAMMAR_TOPICS ....... " + typeof GRAMMAR_TOPICS);
      lines.push("  GRAMMAR_EXERCISES .... " + typeof GRAMMAR_EXERCISES);
      lines.push("  IrregularsApp ........ " + typeof IrregularsApp);
      lines.push("  GrammarApp ........... " + typeof GrammarApp);
      lines.push("  window.__grammarApp .. " + typeof window.__grammarApp);
      lines.push("");
      lines.push("Errores JS (" + window.__jsErrors.length + "):");
      if (window.__jsErrors.length === 0) {
        lines.push("  (ninguno)");
      } else {
        window.__jsErrors.forEach(function(err, i) {
          lines.push("  " + (i+1) + ". " + err);
        });
      }

      document.getElementById("out").textContent = lines.join("\n");
    }, 2000);
  </script>
</body>
</html>
