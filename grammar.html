<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gramática — IRREGULARS</title>
  <meta name="description" content="Gramática inglesa de A2 a B1+: tiempos verbales y condicionales con ejercicios contextuales." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IRREGULARS" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="grammar.css" />
</head>

<body class="app-body">

  <div id="splash-screen" class="splash" aria-hidden="true">
    <div class="splash__logo-wrap">
      <div class="splash__glow"></div>
      <div class="splash__logo"><span>Gr</span></div>
    </div>
    <h1 class="splash__title">GRAMÁTICA</h1>
    <p class="splash__subtitle">De A2 a B1+</p>
    <div class="splash__bar">
      <div id="splash-progress" class="splash__bar-fill"></div>
    </div>
  </div>

  <header class="app-header">
    <a href="index.html" class="brand grammar-back" aria-label="Volver a verbos">
      <span class="brand__logo">Ir</span>
      <span class="brand__text">
        <span class="brand__name">IRREGULARS</span>
        <span class="brand__tag">← Verbos</span>
      </span>
    </a>

    <nav class="topnav" aria-label="Navegación principal">
      <a href="index.html" class="topnav__btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>
        <span>Verbos</span>
      </a>
      <button type="button" id="nav-home" class="topnav__btn is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12l2-2 7-7 7 7 2 2" />
          <path d="M5 10v10a1 1 0 0 0 1 1h3m10-11v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6" />
        </svg>
        <span>Gramática</span>
      </button>
      <button type="button" id="nav-stats" class="topnav__btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z" />
          <path d="M9 19V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10" />
          <path d="M9 19a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z" />
        </svg>
        <span>Estadísticas</span>
      </button>
    </nav>
  </header>

  <main class="app-main">

    <section id="view-home" class="view view--home is-visible">
      <div class="banner">
        <span class="banner__badge">A2 → B1+</span>
        <h2 class="banner__title">Gramática inglesa</h2>
        <p class="banner__text">Tiempos verbales y condicionales con ejercicios contextuales. De cero a B1+.</p>
      </div>

      <!-- Selección de sección -->
      <section class="block">
        <header class="block__head">
          <h3 class="block__title"><span class="block__step">1</span> Sección</h3>
        </header>

        <div class="section-cards" id="section-cards">
          <button type="button" class="section-card is-active" data-section="tenses">
            <span class="section-card__icon">📘</span>
            <span class="section-card__title">Tiempos Verbales</span>
            <span class="section-card__desc">Present, Past, Perfect y contrastes.</span>
          </button>
          <button type="button" class="section-card" data-section="conditionals">
            <span class="section-card__icon">🔀</span>
            <span class="section-card__title">Condicionales</span>
            <span class="section-card__desc">Del tipo 0 al tipo 3.</span>
          </button>
          <button type="button" class="section-card" data-section="mastery">
            <span class="section-card__icon">👑</span>
            <span class="section-card__title">Maestría Global</span>
            <span class="section-card__desc">Examen final: todo mezclado.</span>
          </button>
        </div>
      </section>

      <!-- Dificultad -->
      <section class="block">
        <header class="block__head">
          <h3 class="block__title"><span class="block__step">2</span> Dificultad</h3>
          <span id="selected-difficulty-label" class="block__value">Fácil</span>
        </header>
        <div class="difficulty-grid" id="difficulty-grid">
          <!-- Se rellena por JS -->
        </div>
      </section>

      <!-- Nivel -->
      <section class="block">
        <header class="block__head">
          <h3 class="block__title"><span class="block__step">3</span> Nivel</h3>
          <span id="selected-level-label" class="block__value">Nivel 1</span>
        </header>
        <div class="chips" id="level-chips">
          <!-- Se rellena por JS -->
        </div>
      </section>

      <!-- Cantidad -->
      <section class="block">
        <header class="block__head">
          <h3 class="block__title"><span class="block__step">4</span> Cantidad</h3>
        </header>
        <div class="chips">
          <button type="button" class="chip limit-btn" data-limit="10">10</button>
          <button type="button" class="chip limit-btn is-active" data-limit="25">25</button>
          <button type="button" class="chip limit-btn" data-limit="50">50</button>
          <button type="button" class="chip limit-btn" data-limit="100">100</button>
        </div>
      </section>

      <!-- Reglas del tema -->
      <section class="block">
        <div class="rules-panel" id="rules-panel">
          <div class="rules-panel__head">
            <span class="rules-panel__title" id="rules-title">—</span>
            <span class="rules-panel__cefr" id="rules-cefr">—</span>
          </div>
          <p class="rules-panel__desc" id="rules-desc">—</p>
          <ul class="rules-panel__list" id="rules-list"></ul>
        </div>
      </section>

      <button type="button" class="btn btn--primary btn--lg" id="start-session-btn">
        <span>Comenzar sesión</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M13 5l7 7-7 7" />
        </svg>
      </button>
    </section>

    <section id="view-study" class="view view--study">
      <div class="study-bar">
        <button type="button" class="btn btn--ghost" id="exit-session-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="M12 19l-7-7 7-7" />
          </svg>
          <span>Salir</span>
        </button>

        <div class="study-bar__progress">
          <span id="session-counter" class="study-bar__count">1 / 25</span>
          <div class="progress">
            <div id="session-progress-bar" class="progress__fill"></div>
          </div>
        </div>
      </div>

      <div class="flashcard-stage">
        <div id="flashcard" class="flashcard">
          <div class="flashcard__inner">
            <div class="flash
