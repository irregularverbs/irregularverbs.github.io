<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>IRREGULARS — Verbos irregulares</title>
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body">

  <div id="splash-screen" class="splash">
    <div style="text-align:center; max-width: 90vw;">
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">IRREGULARS</h1>
      <div id="diag" style="font-family: monospace; font-size: 13px; color: #b9b9c4; line-height: 1.8; text-align: left; display: inline-block;">
        <div>· cargando…</div>
      </div>
      <p id="diag-detail" style="margin-top: 16px; font-size: 11px; color: #7a7a89; word-break: break-all;"></p>
    </div>
  </div>

  <script>
    // Sistema de diagnóstico visual
    const diag = document.getElementById("diag");
    const detail = document.getElementById("diag-detail");
    const lines = [];

    function log(name, ok, err) {
      const mark = ok ? "[✓]" : "[✗]";
      const color = ok ? "#10b981" : "#ef4444";
      lines.push('<div style="color:' + color + '">' + mark + ' ' + name + '</div>');
      diag.innerHTML = lines.join("");
      if (err) detail.textContent = String(err);
    }

    window.addEventListener("error", function (e) {
      detail.textContent = "ERROR: " + (e.message || "desconocido") + " — " + (e.filename || "");
    });

    // 1. HTML
    log("index.html", true);
  </script>

  <script src="data-verbs.js" onload="log('data-verbs.js', typeof IRREGULAR_VERBS !== 'undefined', typeof IRREGULAR_VERBS === 'undefined' ? 'IRREGULAR_VERBS no definido' : '')" onerror="log('data-verbs.js', false, 'no se pudo cargar')"></script>

  <script src="data-generator.js" onload="log('data-generator.js', typeof ALL_EXERCISES !== 'undefined', typeof ALL_EXERCISES === 'undefined' ? 'ALL_EXERCISES no definido' : (ALL_EXERCISES.length + ' ejercicios'))" onerror="log('data-generator.js', false, 'no se pudo cargar')"></script>

  <script src="app.js" onload="log('app.js', typeof IrregularsApp !== 'undefined', typeof IrregularsApp === 'undefined' ? 'IrregularsApp no definido' : '')" onerror="log('app.js', false, 'no se pudo cargar')"></script>

  <script>
    log("app.init()", typeof app !== "undefined" && typeof app.init === "function");

    // Si todo ha ido bien, redirigir a la app normal
    // (aquí NO redirigimos: mostramos el diagnóstico)
  </script>

</body>
</html>
