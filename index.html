<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico IRREGULARS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body" style="padding:20px">

  <h1 style="font-size:20px;margin-bottom:16px;">DIAGNÓSTICO</h1>

  <div id="out" style="font-family:monospace;font-size:12px;line-height:1.7;color:#b9b9c4;white-space:pre-wrap;"></div>

  <button id="start-session-btn" style="display:none">test</button>

  <script>
    var out = document.getElementById("out");
    function L(label, value, ok) {
      var color = ok === false ? "#ef4444" : ok === true ? "#10b981" : "#b9b9c4";
      out.innerHTML += '<span style="color:' + color + '">' + label + ': ' + value + '</span>\n';
    }

    window.addEventListener("error", function (e) {
      out.innerHTML += '<span style="color:#ef4444">ERROR GLOBAL: ' + (e.message || "?") + '\n  → ' + (e.filename || "") + " línea " + (e.lineno || "?") + '</span>\n';
    });
  </script>

  <script src="data-verbs.js"></script>
  <script>
    L("IRREGULAR_VERBS", typeof IRREGULAR_VERBS, typeof IRREGULAR_VERBS === "object");
  </script>

  <script src="data-generator.js"></script>
  <script>
    L("ALL_EXERCISES", typeof ALL_EXERCISES, typeof ALL_EXERCISES === "object");
    if (typeof ALL_EXERCISES === "object" && ALL_EXERCISES) {
      L("  ALL_EXERCISES.length", ALL_EXERCISES.length, ALL_EXERCISES.length > 0);
    }
  </script>

  <script src="app.js"></script>
  <script>
    L("IrregularsApp", typeof IrregularsApp, typeof IrregularsApp === "function");
    L("typeof app", typeof app, typeof app === "object");

    if (typeof app === "object" && app) {
      L("app.startSession", typeof app.startSession, typeof app.startSession === "function");
      L("app.priority", app.priority, true);
      L("app.mode", app.mode, true);
      L("app.limit", app.limit, true);
    }

    var btn = document.getElementById("start-session-btn");
    L("botón start-session-btn existe", !!btn, !!btn);

    setTimeout(function () {
      L("--- después de 300ms ---", "", null);
      if (typeof app === "object" && app && app.startSession) {
        L("¿app.startSession está definida?", "sí", true);
      } else {
        L("¿app.startSession está definida?", "NO", false);
      }
    }, 300);
  </script>

</body>
</html>
